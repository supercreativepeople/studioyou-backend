name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: neat-tangent-474222-m9
  REGION: us-east1
  SERVICE_NAME: studioyou-api

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install gcloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Create service account key file
        run: |
          mkdir -p ~/.config/gcloud
          cat > /tmp/gcp-key.json << 'KEYEOF'
          ${{ secrets.GCP_SA_KEY_JSON }}
          KEYEOF

      - name: Authenticate with GCP
        run: gcloud auth activate-service-account --key-file=/tmp/gcp-key.json --project=${{ env.PROJECT_ID }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --source . \
            --project ${{ env.PROJECT_ID }} \
            --region ${{ env.REGION }} \
            --allow-unauthenticated \
            --set-env-vars \
            "ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},\
            SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
            SUPABASE_KEY=${{ secrets.SUPABASE_KEY }},\
            RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},\
            SY_SECRET_KEY=${{ secrets.SY_SECRET_KEY }},\
            FRONTEND_URL=${{ secrets.FRONTEND_URL }},\
            REACTOR_API_KEY=${{ secrets.REACTOR_API_KEY }}"

      - name: Verify deployment
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)'
