name: Deploy to Cloud Run

on:
  push:
    branches:
      - main

env:
  PROJECT_ID: neat-tangent-474222-m9
  REGION: us-east1
  SERVICE_NAME: studioyou-api
  IMAGE: gcr.io/neat-tangent-474222-m9/studioyou-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate with GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for GCR
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          docker build -t ${{ env.IMAGE }}:${{ github.sha }} -t ${{ env.IMAGE }}:latest .
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="\
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }},\
          SUPABASE_URL=${{ secrets.SUPABASE_URL }},\
          SUPABASE_KEY=${{ secrets.SUPABASE_KEY }},\
          RESEND_API_KEY=${{ secrets.RESEND_API_KEY }},\
          RESEND_FROM_EMAIL=${{ secrets.RESEND_FROM_EMAIL }},\
          SY_SECRET_KEY=${{ secrets.SECRET_KEY }},\
          FRONTEND_URL=https://studioyou.app,\
          FY_ORCHESTRATION_MODEL=claude-fable-5,\
          FY_SURFACE_MODEL=claude-sonnet-4-6,\
          REACTOR_API_KEY=${{ secrets.REACTOR_API_KEY }},\
          FAL_API_KEY=${{ secrets.FAL_API_KEY }},\
          TAVUS_API_KEY=${{ secrets.TAVUS_API_KEY }},\
          FUTUREYOU_PERSONA_ID=p2dbadc2efc3,\
          TAVUS_LIVEKIT_PERSONA_ID=pb0277f1cfc1,\
          LIVEKIT_URL=${{ secrets.LIVEKIT_URL }},\
          LIVEKIT_API_KEY=${{ secrets.LIVEKIT_API_KEY }},\
          LIVEKIT_API_SECRET=${{ secrets.LIVEKIT_API_SECRET }}"

      - name: Verify deployment
        run: |
          gcloud run services describe ${{ env.SERVICE_NAME }} \
            --project=${{ env.PROJECT_ID }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)'
