steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studioyou-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'studioyou-api'
      - '--image=gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
      - '--region=us-east1'
      - '--platform=managed'
      - '--set-env-vars=ANTHROPIC_API_KEY=$_ANTHROPIC_API_KEY,SUPABASE_URL=$_SUPABASE_URL,SUPABASE_KEY=$_SUPABASE_KEY,RESEND_API_KEY=$_RESEND_API_KEY,SY_SECRET_KEY=$_SY_SECRET_KEY,FRONTEND_URL=$_FRONTEND_URL,REACTOR_API_KEY=$_REACTOR_API_KEY,TAVUS_API_KEY=$_TAVUS_API_KEY,LIVEKIT_API_KEY=$_LIVEKIT_API_KEY,LIVEKIT_API_SECRET=$_LIVEKIT_API_SECRET,LIVEKIT_URL=$_LIVEKIT_URL,FUTUREYOU_PERSONA_ID=$_FUTUREYOU_PERSONA_ID,TAVUS_LIVEKIT_PERSONA_ID=$_TAVUS_LIVEKIT_PERSONA_ID,FAL_API_KEY=$_FAL_API_KEY,GITLAB_TOKEN=$_GITLAB_TOKEN'

images:
  - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/studioyou-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
