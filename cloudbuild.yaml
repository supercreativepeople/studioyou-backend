steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studioyou-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'studioyou-api'
      - '--image=gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
      - '--region=us-east1'
      - '--platform=managed'
      - '--set-env-vars=ANTHROPIC_API_KEY=$_ANTHROPIC_API_KEY,SUPABASE_URL=$_SUPABASE_URL,SUPABASE_SERVICE_KEY=$_SUPABASE_SERVICE_KEY,RESEND_API_KEY=$_RESEND_API_KEY,SY_SECRET_KEY=$_SY_SECRET_KEY,FRONTEND_URL=$_FRONTEND_URL,REACTOR_API_KEY=$_REACTOR_API_KEY'

images:
  - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/studioyou-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
