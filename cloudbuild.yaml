steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: 
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studioyou-api:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'studioyou-api'
      - '--image=gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
      - '--region=us-east1'
      - '--platform=managed'

images:
  - 'gcr.io/$PROJECT_ID/studioyou-api:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/studioyou-api:latest'

options:
  logging: CLOUD_LOGGING_ONLY
